name: Build Harness and Release

on:
  workflow_dispatch:
    inputs:
      manifest_version:
        description: 'manifest 中的版本号（例如 0.1.0）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release（测试时取消勾选即可只构建不发布）'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86
          - os: ubuntu-22.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="Harness"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 检出 deepseek-harness 源码
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          fetch-depth: 1
          path: server

      - name: 预置插件市场（把 dshmarket 合并进源码一起构建）
        working-directory: server
        run: |
          set -euo pipefail
          # 为什么不用 `pnpm dsh plugin --profile web add dshmarket`：
          # 它把 profile 写进 CI 机器自己的 $DSH_HOME（~/.dsh/profiles/web），
          # 打包时根本不在 server/ 里，端到端启动后自然不会生效。
          # 改为源码级预置：dshmarket 成为安装依赖 + web profile 模板自带它，
          # 首次启动即自动初始化出带市场的 web profile。
          # 1) apps/cli 是运行时安装锚点（INSTALL_ANCHOR），依赖闭包随 pnpm install 进入 node_modules
          node - <<'NODE'
          const fs = require('fs')
          const p = 'apps/cli/package.json'
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
          if (pkg.dependencies.dshmarket === undefined) {
            pkg.dependencies.dshmarket = '^1.11.1'
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
            console.log('apps/cli/package.json += dshmarket ^1.11.1')
          } else {
            console.log('apps/cli/package.json already has dshmarket, skip')
          }
          NODE
          # 2) web profile 模板带上 dshmarket；INSTALLATION_OWNED 记录旧模板，
          #    让已存在（升级用户）的 web profile 在下次启动时自动迁移补上市场
          node - <<'NODE'
          const fs = require('fs')
          const p = 'packages/boot/app-boot/src/profile.ts'
          let src = fs.readFileSync(p, 'utf8')
          const OLD_T = "  web: ['@deepseek-ai/dsh-base', '@deepseek-ai/dsh-web-app'],"
          const NEW_T = "  web: ['@deepseek-ai/dsh-base', '@deepseek-ai/dsh-web-app', 'dshmarket'],"
          if (!src.includes(NEW_T)) {
            if (!src.includes(OLD_T)) throw new Error('web 模板字符串未找到，上游源码已变化，请人工核对 profile.ts')
            src = src.replace(OLD_T, NEW_T)
          }
          const OLD_O = 'const INSTALLATION_OWNED_PROFILE_TUPLES: Record<string, readonly string[]> = {\n  headless:'
          const NEW_O = 'const INSTALLATION_OWNED_PROFILE_TUPLES: Record<string, readonly string[]> = {\n  web: [\'@deepseek-ai/dsh-base\', \'@deepseek-ai/dsh-web-app\'],\n  headless:'
          if (!src.includes("web: ['@deepseek-ai/dsh-base', '@deepseek-ai/dsh-web-app'],\n  headless:")) {
            if (!src.includes(OLD_O)) throw new Error('INSTALLATION_OWNED 表头未找到，上游源码已变化，请人工核对 profile.ts')
            src = src.replace(OLD_O, NEW_O)
          }
          fs.writeFileSync(p, src)
          console.log('profile.ts: web 模板 + installation-owned 已加入 dshmarket')
          NODE
          grep -n "dshmarket" apps/cli/package.json packages/boot/app-boot/src/profile.ts

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: 安装依赖并构建
        working-directory: server
        run: |
          # CI 下 pnpm 默认 --frozen-lockfile；我们构建期才合并 dshmarket 依赖，
          # 上游锁文件没有它，必须 --no-frozen-lockfile 让其解析并更新锁文件
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential

      - name: 构建 landlock-run
        working-directory: server/native/landlock-run
        run: |
          pnpm run build:native

      - name: 验证插件市场已随安装打包
        working-directory: server
        run: |
          set -euo pipefail
          node -e "const { createRequire } = require('module'); const r = createRequire(process.cwd() + '/apps/cli/package.json'); const p = r.resolve('dshmarket/package.json'); console.log('OK dshmarket 从安装锚点可解析:', p)"
          node -e "const fs=require('fs'); const s=fs.readFileSync('packages/boot/app-boot/src/profile.ts','utf8'); if(!s.includes(\"dshmarket\")) { console.error('web 模板未包含 dshmarket'); process.exit(1) } console.log('OK web profile 模板已预置 dshmarket')"

      - name: 清理源码（仅清 git 与仓库元数据；保留源码供官方 release:pack 使用）
        working-directory: server
        run: rm -rf .github .git *.md

      - name: 官方 release:pack —— 打全部 npm tarball（dsh + vendor + landlock）
        working-directory: server
        run: |
          set -euo pipefail
          # GitHub Actions 自动设 CI=true，规避 pnpm 的
          # ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY；显式设双保险。
          export CI=true
          # dsh family：packages/*/* + apps/* 全部统一版本
          pnpm run release:pack --family dsh --out dist/npm
          # vendor family：dsh 包把 vendored framework 声明为 peer，
          # npm flat install 需要它同目录交付
          pnpm run release:pack --family vendor --out dist/npm-vendor
          # landlock entry（dsh-sandbox-local 运行时依赖的 native binding 来源）
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run/packages/entry pack --pack-destination dist/npm-landlock
          echo "=== pack 产出统计 ==="
          echo "dsh tarball:    $(ls dist/npm/*.tgz 2>/dev/null | wc -l)"
          echo "vendor tarball: $(ls dist/npm-vendor/*.tgz 2>/dev/null | wc -l)"
          echo "landlock tarball: $(ls dist/npm-landlock/*.tgz 2>/dev/null | wc -l)"

      - name: 组装 server2 扁平 node_modules（按 dsh 闭包挑 tarball，npm install）
        working-directory: server
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const { execFileSync } = require('child_process')
          function readP(p) { try { return JSON.parse(fs.readFileSync(p, 'utf8')) } catch { return null } }
          // —— 1) 计算 dsh 运行时闭包 member（含 vendor 的 peer）——
          const allMembers = new Map() // name -> dir
          function collect(dir) {
            if (!fs.existsSync(dir)) return
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!e.isDirectory() || e.name === 'node_modules' || e.name === '.git') continue
              const sub = path.join(dir, e.name)
              const pj = path.join(sub, 'package.json')
              if (fs.existsSync(pj)) { const p = readP(pj); if (p && p.name) allMembers.set(p.name, sub) }
              collect(sub)
            }
          }
          for (const r of ['packages', 'apps', 'vendor', 'native']) collect(r)
          const used = new Set()
          function visit(name) {
            if (used.has(name)) return
            used.add(name)
            const dir = allMembers.get(name)
            if (!dir) return
            const p = readP(path.join(dir, 'package.json'))
            if (!p) return
            for (const k of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              if (!p[k]) continue
              for (const dep in p[k]) if (allMembers.has(dep)) visit(dep)
            }
          }
          visit('@deepseek-ai/dsh')
          const closureNames = new Set([...used].filter(n => allMembers.has(n)))
          console.log('dsh 闭包 member 数:', closureNames.size)
          // —— 2) 收集 pack 产物里所有 tarball -> {name,url} ——
          const tarballOf = new Map()
          for (const d of ['dist/npm', 'dist/npm-vendor', 'dist/npm-landlock']) {
            if (!fs.existsSync(d)) continue
            for (const tgz of fs.readdirSync(d).filter(x => x.endsWith('.tgz'))) {
              const abs = path.resolve(d, tgz)
              // 注意：tarball 里读的是 JSON 字符串，直接用 JSON.parse，
              // 不能走 readP（那是按文件路径读的）
              const manifest = JSON.parse(execFileSync('tar', ['-xOzf', abs, 'package/package.json']).toString())
              if (manifest && manifest.name) tarballOf.set(manifest.name, 'file:' + abs)
            }
          }
          // —— 3) 只选闭包内的 tarball ——
          const needed = new Map()
          for (const name of closureNames) if (tarballOf.has(name)) needed.set(name, tarballOf.get(name))
          console.log('闭包 tarball 数:', needed.size)
          // —— 4) 写 consumer package.json ——
          const consumer = 'dist/consumer'
          fs.rmSync(consumer, { recursive: true, force: true })
          fs.mkdirSync(consumer, { recursive: true })
          fs.writeFileSync(path.join(consumer, 'package.json'), JSON.stringify({
            name: 'dsh-server-2',
            version: '0.0.0',
            private: true,
            type: 'module',
            dependencies: Object.fromEntries(needed),
          }, null, 2) + '\n')
          const list = [...needed.entries()].map(([n, p]) => '  ' + n + ' <- ' + p).join('\n')
          fs.writeFileSync(path.join(consumer, 'closure-manifest.txt'), list + '\n')
          console.log('consumer 依赖:\n' + list)
          NODE

          # —— 5) npm flat install ——
          #    与官方 verify-packed-install 一致 --omit=optional；
          #    --ignore-scripts 避免发布包触发额外安装副作用
          (
            cd dist/consumer
            npm install --no-audit --no-fund --package-lock=false --omit=optional --ignore-scripts
          )
          echo "=== 扁平 node_modules 顶层 @deepseek-ai 包数 ==="
          ls dist/consumer/node_modules/@deepseek-ai 2>/dev/null | wc -l
          ls dist/consumer/node_modules/dshmarket 2>/dev/null \
            && echo "OK dshmarket 已随闭包装入" \
            || echo "WARN dshmarket 未装入（检查 @deepseek-ai/dsh dependencies）"

      - name: 校验扁平结构可启动 + 闭包完整
        working-directory: server
        run: |
          set -euo pipefail
          echo "=== dsh --version（从扁平 node_modules 触发）==="
          timeout 15 node dist/consumer/node_modules/@deepseek-ai/dsh/lib/bin.js --version 2>&1 | head -3
          echo ""
          echo "=== 关键闭包 resolve 校验 ==="
          node -e "
            const { createRequire } = require('module')
            const r = createRequire(process.cwd() + '/dist/consumer/package.json')
            const must = [
              'dshmarket/package.json',
              '@deepseek-ai/dsh-base/package.json',
              '@deepseek-ai/cordis/package.json',
              '@deepseek-ai/dsh-web-frontend/dist/index.html',
            ]
            for (const m of must) { try { r.resolve(m); console.log('  OK', m) } catch (e) { console.error('  FAIL', m, e.code); process.exit(1) } }
          "

      - name: 压缩 server 目录（扁平 npm 结构 → fpk 供体）
        run: |
          set -euo pipefail
          # 以 dist/consumer 这个 server2 形态扁平树为 fpk 载体（tar 根即安装根）：
          #   安装后目录内含 package.json + node_modules/（含 dshmarket）
          #   启动命令：cd <root> && node node_modules/@deepseek-ai/dsh/lib/bin.js web
          cd server
          tar -czf ../server.tar.gz -C dist/consumer .
          cd ..
          echo "=== server.tar.gz ==="
          ls -lh server.tar.gz


      - name: 检出 buildbot 仓库（包含 fnpack 模板）
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.1-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.1-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制压缩包到 app 目录
        run: |
          mkdir -p build_workspace/Harness/app
          cp server.tar.gz build_workspace/Harness/app/

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      # 测试运行时上传 fpk 到 Artifact，与 publish 解耦：取消 publish 也仍能在 Action UI 下载 fpk
      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  publish:
    name: 发布到 Fndepot Release
    needs: build
    # publish 开关继承自生产 yaml；测试时在 UI 上取消勾选即仅构建 + 输出 fpk Artifact，不发布
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有架构的 fpk 文件
        uses: actions/download-artifact@v7
        with:
          path: fpk_files
          merge-multiple: true

      - name: 生成当前日期 tag（格式 年.月.日）
        id: date_tag
        run: |
          TAG=$(date +'%Y.%-m.%-d')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=【$TAG 更新】" >> $GITHUB_OUTPUT

      - name: 使用 GitHub CLI 发布到 shuangji66/Fndepot
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="shuangji66/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          TITLE="${{ steps.date_tag.outputs.RELEASE_TITLE }}"
          MANIFEST_VERSION="${{ needs.build.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build.outputs.changelog }}"
          NEW_NOTE="构建 ${{ needs.build.outputs.app_name }} 版本 ${MANIFEST_VERSION}。更新日志：${CHANGELOG}"

          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            echo "Release $TAG 已存在，将添加资产并追加描述"
            CURRENT_BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
            if [ -n "$CURRENT_BODY" ]; then
              NEW_BODY="${CURRENT_BODY}"$'\n'"$NEW_NOTE"
            else
              NEW_BODY="$NEW_NOTE"
            fi
            gh release edit "$TAG" --repo "$REPO" --notes "$NEW_BODY"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NEW_NOTE"
          fi

          for fpk in fpk_files/*.fpk; do
            echo "上传 $fpk"
            gh release upload "$TAG" "$fpk" --repo "$REPO" --clobber
          done

      - name: 更新 fnpack.json 中的 Harness 条目
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="shuangji66/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          APP_NAME="${{ needs.build.outputs.app_name }}"
          MANIFEST_VERSION="${{ needs.build.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build.outputs.changelog }}"

          DOWNLOAD_URL_X86="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-x86.fpk"
          DOWNLOAD_URL_ARM="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-arm.fpk"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" fndepot_repo
          cd fndepot_repo

          jq --arg app "$APP_NAME" \
             --arg version "$MANIFEST_VERSION" \
             --arg changelog "$CHANGELOG" \
             --arg url_x86 "$DOWNLOAD_URL_X86" \
             --arg url_arm "$DOWNLOAD_URL_ARM" \
             '.[$app].version = $version |
              .[$app].changelog = $changelog |
              .[$app].arch_diff.x86.download_url = $url_x86 |
              .[$app].arch_diff.arm.download_url = $url_arm' \
             fnpack.json > fnpack.json.tmp
          mv fnpack.json.tmp fnpack.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          git commit -m "chore: update ${APP_NAME} to ${MANIFEST_VERSION} (${TAG})"
          git push

