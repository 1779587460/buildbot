name: Build Harness and Release

on:
  workflow_dispatch:
    inputs:
      manifest_version:
        description: 'manifest 中的版本号（例如 0.1.0）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true
      plugins:
        description: '要预置的插件列表（逗号分隔，例如 dshmarket,myplugin）'
        required: false
        type: string
        default: 'dshmarket'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86
          - os: ubuntu-22.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="Harness"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      # ===== 第一步：下载并解压（带诊断） =====
      - name: 下载并解压 @deepseek-ai/dsh（带诊断）
        run: |
          set -euo pipefail
          mkdir -p server
          cd server
          echo '{}' > package.json
          pnpm init -y > /dev/null 2>&1

          echo "=== 检查包 @deepseek-ai/dsh 是否存在 ==="
          if ! npm view @deepseek-ai/dsh version; then
            echo "❌ 错误：包 @deepseek-ai/dsh 不存在于 npm registry，请检查："
            echo "  1. 包名是否正确（是否为 @deepseek-ai/dsh）"
            echo "  2. 是否为私有包（需要设置 npm token）"
            echo "  3. 网络是否正常"
            exit 1
          fi

          echo "=== 开始下载 @deepseek-ai/dsh ==="
          npm pack @deepseek-ai/dsh --loglevel=verbose

          DSH_TGZ=$(ls -t deepseek-ai-dsh-*.tgz 2>/dev/null | head -1)
          if [ -z "$DSH_TGZ" ]; then
            echo "错误：未生成 .tgz 文件"
            exit 1
          fi
          echo "下载的包：$DSH_TGZ"
          mkdir -p dsh-pkg
          tar -xf "$DSH_TGZ" -C dsh-pkg
          echo "DSH_TGZ=$DSH_TGZ" >> $GITHUB_ENV

      - name: 修改 package.json 添加插件依赖
        working-directory: server
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const pluginsInput = '${{ github.event.inputs.plugins }}';
          const pluginNames = [...new Set(pluginsInput.split(',').map(s => s.trim()).filter(Boolean))];
          if (pluginNames.length === 0) {
            console.log('未指定插件，跳过修改');
            process.exit(0);
          }
          console.log(`要添加的插件: ${pluginNames.join(', ')}`);

          const pkgPath = path.join('dsh-pkg', 'package', 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.dependencies ??= {};

          for (const name of pluginNames) {
            let version;
            try {
              version = execSync(`npm view ${name} version`, { encoding: 'utf8' }).trim();
            } catch {
              version = 'latest';
            }
            const depVer = `^${version}`;
            pkg.dependencies[name] = depVer;
            console.log(`  添加 ${name}@${depVer}`);
          }
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          console.log('✅ package.json 修改完成');
          NODE

      - name: 重新打包修改后的 @deepseek-ai/dsh
        working-directory: server
        run: |
          cd dsh-pkg/package
          npm pack
          NEW_TGZ=$(ls -t *.tgz | head -1)
          mv "$NEW_TGZ" ../../
          echo "NEW_TGZ=$NEW_TGZ" >> $GITHUB_ENV

      - name: 安装修改后的包（使用 npm install）
        working-directory: server
        run: |
          npm install "./${{ env.NEW_TGZ }}"

      - name: 修改 index.js 将插件加入 web 数组
        working-directory: server
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const pluginsInput = '${{ github.event.inputs.plugins }}';
          const pluginNames = [...new Set(pluginsInput.split(',').map(s => s.trim()).filter(Boolean))];
          if (pluginNames.length === 0) {
            console.log('未指定插件，跳过 index.js 修改');
            process.exit(0);
          }

          const indexPath = path.join('node_modules', '@deepseek-ai', 'dsh-app-boot', 'lib', 'index.js');
          if (!fs.existsSync(indexPath)) {
            console.error(`index.js 不存在: ${indexPath}`);
            process.exit(1);
          }
          let code = fs.readFileSync(indexPath, 'utf8');

          const webRegex = /web:\s*\[\s*(["']@deepseek-ai\/dsh-base["']\s*,\s*["']@deepseek-ai\/dsh-web-app["']\s*)(?:,\s*[^\]]*)?\]/;
          if (webRegex.test(code)) {
            code = code.replace(webRegex, (match, basePart) => {
              const existingPlugins = match.match(/,\s*(["'])(.*?)\1/g) || [];
              const existingNames = existingPlugins.map(s => s.replace(/,\s*["']|["']/g, '').trim()).filter(n => n && !n.includes('@deepseek-ai/dsh-base') && !n.includes('@deepseek-ai/dsh-web-app'));
              const all = [...new Set([...existingNames, ...pluginNames])];
              const newItems = ['"@deepseek-ai/dsh-base"', '"@deepseek-ai/dsh-web-app"', ...all.map(p => `"${p}"`)];
              return `web: [${newItems.join(', ')}]`;
            });
            fs.writeFileSync(indexPath, code);
            console.log(`✅ 已更新 ${indexPath}，插件列表: ${pluginNames.join(', ')}`);
          } else {
            console.error('未找到 web 模板，请检查 index.js');
            process.exit(1);
          }
          NODE

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential

      - name: 构建landlock-run
        working-directory: server/native/landlock-run
        run: |
          pnpm run build:native

      - name: 验证插件市场已随安装打包
        working-directory: server
        run: |
          set -euo pipefail
          PLUGINS="${{ github.event.inputs.plugins }}"
          IFS=',' read -ra PKGS <<< "$PLUGINS"
          for pkg in "${PKGS[@]}"; do
            pkg=$(echo "$pkg" | xargs)
            if [ -n "$pkg" ]; then
              node -e "const { createRequire } = require('module'); const r = createRequire(process.cwd() + '/package.json'); const p = r.resolve('$pkg/package.json'); console.log('OK $pkg 可解析:', p)"
            fi
          done
          node -e "const fs=require('fs'); const s=fs.readFileSync('node_modules/@deepseek-ai/dsh-app-boot/lib/index.js','utf8'); const plugins='${{ github.event.inputs.plugins }}'.split(',').map(p=>p.trim()).filter(Boolean); for (const p of plugins) { if (!s.includes('\"'+p+'\"')) { console.error('index.js 未包含插件 '+p); process.exit(1) } } console.log('OK 所有插件已预置在 index.js')"

      - name: 清理源码
        working-directory: server
        run: rm -rf .github .git *.md

      - name: 压缩 server目录
        run: |
          tar -czf server.tar.gz server

      - name: 检出 buildbot 仓库（包含 fnpack 模板）
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.1-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.1-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制压缩包到 app 目录
        run: |
          mkdir -p build_workspace/Harness/app
          cp server.tar.gz build_workspace/Harness/app/

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有架构的 fpk 文件
        uses: actions/download-artifact@v7
        with:
          path: fpk_files
          merge-multiple: true

      - name: 生成当前日期 tag（格式 年.月.日）
        id: date_tag
        run: |
          TAG=$(date +'%Y.%-m.%-d')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=【$TAG 更新】" >> $GITHUB_OUTPUT

      - name: 使用 GitHub CLI 发布到 shuangji66/Fndepot
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="1779587460/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          TITLE="${{ steps.date_tag.outputs.RELEASE_TITLE }}"
          MANIFEST_VERSION="${{ needs.build.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build.outputs.changelog }}"
          NEW_NOTE="构建 ${{ needs.build.outputs.app_name }} 版本 ${MANIFEST_VERSION}。更新日志：${CHANGELOG}"

          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            echo "Release $TAG 已存在，将添加资产并追加描述"
            CURRENT_BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
            if [ -n "$CURRENT_BODY" ]; then
              NEW_BODY="${CURRENT_BODY}"$'\n'"$NEW_NOTE"
            else
              NEW_BODY="$NEW_NOTE"
            fi
            gh release edit "$TAG" --repo "$REPO" --notes "$NEW_BODY"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NEW_NOTE"
          fi

          for fpk in fpk_files/*.fpk; do
            echo "上传 $fpk"
            gh release upload "$TAG" "$fpk" --repo "$REPO" --clobber
          done

      - name: 更新 fnpack.json 中的 Harness 条目
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="1779587460/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          APP_NAME="${{ needs.build.outputs.app_name }}"
          MANIFEST_VERSION="${{ needs.build.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build.outputs.changelog }}"

          DOWNLOAD_URL_X86="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-x86.fpk"
          DOWNLOAD_URL_ARM="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-arm.fpk"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" fndepot_repo
          cd fndepot_repo

          jq --arg app "$APP_NAME" \
             --arg version "$MANIFEST_VERSION" \
             --arg changelog "$CHANGELOG" \
             --arg url_x86 "$DOWNLOAD_URL_X86" \
             --arg url_arm "$DOWNLOAD_URL_ARM" \
             '.[$app].version = $version |
              .[$app].changelog = $changelog |
              .[$app].arch_diff.x86.download_url = $url_x86 |
              .[$app].arch_diff.arm.download_url = $url_arm' \
             fnpack.json > fnpack.json.tmp
          mv fnpack.json.tmp fnpack.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          git commit -m "chore: update ${APP_NAME} to ${MANIFEST_VERSION} (${TAG})"
          git push
