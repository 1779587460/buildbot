name: Build Fluxor and Release

on:
  workflow_dispatch:
    inputs:
      manifest_version:
        description: 'manifest 中的版本号（例如 1.0.0）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
            goarch: amd64
            mihomo_assets:
              - 'mihomo-linux-amd64-v3'
              - 'mihomo-linux-amd64-v2'
              - 'mihomo-linux-amd64-v1'
          - os: ubuntu-24.04-arm
            platform: arm
            goarch: arm64
            mihomo_assets:
              - 'mihomo-linux-arm64'
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="Fluxor"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 安装依赖（Node.js、Go、jq、unzip等）
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl jq unzip
          # 安装 Node.js 24
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          # 安装 Go
          sudo snap install go --classic

      - name: 克隆 fluxor 源码
        run: |
          git clone https://github.com/shuangji66/fluxor.git fluxor-src
          ls -la fluxor-src

      - name: 构建前端 (web)
        working-directory: ./fluxor-src/web
        run: |
          npm ci
          npm run build

      - name: 构建 Go 后端（指定 GOARCH）
        working-directory: ./fluxor-src
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -tags vue -ldflags="-s -w" -o fluxor-${{ matrix.goarch }}

      - name: 检出 buildbot 仓库
        uses: actions/checkout@v6
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区并创建目录结构
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            FNPACK_BIN="fnpack-1.2.1-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.1-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          mkdir -p "$APP_DIR"/app_tmp/{ui/meta,ui/zash,geoip,bin,ruleset}

      - name: 复制 fluxor 二进制到 app_tmp/bin（带架构后缀）
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          cp fluxor-src/fluxor-${{ matrix.goarch }} "$APP_DIR/app_tmp/bin/"
          chmod +x "$APP_DIR/app_tmp/bin/fluxor-${{ matrix.goarch }}"

      - name: 下载 geosite.dat 和 geoip.dat
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          wget -O "$APP_DIR/app_tmp/geoip/geosite.dat" \
            https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
          wget -O "$APP_DIR/app_tmp/geoip/geoip.dat" \
            https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat

      - name: 下载并解压 zashboard (dist-cdn-fonts.zip)
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          # 获取最新 release 的 zip 下载 URL
          ZASH_URL=$(curl -s https://api.github.com/repos/Zephyruso/zashboard/releases/latest | \
            jq -r '.assets[] | select(.name == "dist-cdn-fonts.zip") | .browser_download_url')
          if [ -z "$ZASH_URL" ]; then
            echo "错误：未找到 dist-cdn-fonts.zip"
            exit 1
          fi
          wget "$ZASH_URL" -O zash.zip
          unzip zash.zip -d zash_extract
          # 提取 dist 目录下的所有文件到 ui/zash
          cp -r zash_extract/dist/* "$APP_DIR/app_tmp/ui/zash/"
          rm -rf zash.zip zash_extract

      - name: 下载并解压 metacubexd (compressed-dist.tgz)
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          META_URL=$(curl -s https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest | \
            jq -r '.assets[] | select(.name == "compressed-dist.tgz") | .browser_download_url')
          if [ -z "$META_URL" ]; then
            echo "错误：未找到 compressed-dist.tgz"
            exit 1
          fi
          wget "$META_URL" -O meta.tgz
          mkdir meta_extract
          tar -xzf meta.tgz -C meta_extract
          # 将解压后的所有文件复制到 ui/meta
          cp -r meta_extract/* "$APP_DIR/app_tmp/ui/meta/"
          rm -rf meta.tgz meta_extract

      - name: 下载并解压 mihomo (多个版本)
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          # 获取最新 release 的 assets 列表
          RELEASES_JSON=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          for asset_pattern in ${{ join(matrix.mihomo_assets, ' ') }}; do
            # 匹配 asset 名称，例如 mihomo-linux-amd64-v3-*.gz
            DOWNLOAD_URL=$(echo "$RELEASES_JSON" | jq -r \
              --arg pat "$asset_pattern" '.assets[] | select(.name | test("^" + $pat + "-.*\\.gz$")) | .browser_download_url' | head -1)
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "警告：未找到匹配 $asset_pattern 的 asset"
              continue
            fi
            wget "$DOWNLOAD_URL" -O mihomo.gz
            gunzip -c mihomo.gz > "$APP_DIR/app_tmp/bin/${asset_pattern}"
            chmod +x "$APP_DIR/app_tmp/bin/${asset_pattern}"
            rm mihomo.gz
          done

      - name: 下载规则集文件到 app_tmp/ruleset
        run: |
          APP_DIR="build_workspace/${{ steps.set_vars.outputs.app_name }}/app"
          RULESET_DIR="$APP_DIR/app_tmp/ruleset"
          # 定义所有需要下载的文件列表（每行一个）
          cat << 'EOF' | while read -r file; do
            fakeip-filter.mrs
            ads.mrs
            private.mrs
            trackerslist.mrs
            applications.list
            microsoft-cn.mrs
            apple-cn.mrs
            google-cn.mrs
            games-cn.mrs
            games.mrs
            netflix.mrs
            disney.mrs
            max.mrs
            primevideo.mrs
            appletv.mrs
            youtube.mrs
            tiktok.mrs
            bilibili.mrs
            spotify.mrs
            media.mrs
            ai.mrs
            networktest.mrs
            tld-proxy.mrs
            gfw.mrs
            proxy.mrs
            cn.mrs
            privateip.mrs
            cnip.mrs
            telegramip.mrs
            netflixip.mrs
            mediaip.mrs
          EOF
          do
            wget -O "$RULESET_DIR/$file" \
              "https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/$file"
          done

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          sudo apt-get update && sudo apt-get install -y jq
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  publish:
    name: 发布到 Fndepot Release
    needs: build
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有架构的 fpk 文件
        uses: actions/download-artifact@v7
        with:
          path: fpk_files
          merge-multiple: true

      - name: 生成当前日期 tag（格式 年.月.日）
        id: date_tag
        run: |
          TAG=$(date +'%Y.%-m.%-d')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=【$TAG 更新】" >> $GITHUB_OUTPUT

      - name: 使用 GitHub CLI 发布到 shuangji66/Fndepot
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="shuangji66/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          TITLE="${{ steps.date_tag.outputs.RELEASE_TITLE }}"
          MANIFEST_VERSION="${{ needs.build.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build.outputs.changelog }}"
          NEW_NOTE="构建 ${{ needs.build.outputs.app_name }} 版本 ${MANIFEST_VERSION}。更新日志：${CHANGELOG}"

          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            echo "Release $TAG 已存在，将添加资产并追加描述"
            CURRENT_BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
            if [ -n "$CURRENT_BODY" ]; then
              NEW_BODY="${CURRENT_BODY}"$'\n'"$NEW_NOTE"
            else
              NEW_BODY="$NEW_NOTE"
            fi
            gh release edit "$TAG" --repo "$REPO" --notes "$NEW_BODY"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NEW_NOTE"
          fi

          for fpk in fpk_files/*.fpk; do
            echo "上传 $fpk"
            gh release upload "$TAG" "$fpk" --repo "$REPO" --clobber
          done

      - name: 更新 fnpack.json 中的 Fluxor 条目
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="shuangji66/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          APP_NAME="${{ needs.build.outputs.app_name }}"
          MANIFEST_VERSION="${{ needs.build.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build.outputs.changelog }}"

          DOWNLOAD_URL_X86="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-x86.fpk"
          DOWNLOAD_URL_ARM="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-arm.fpk"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" fndepot_repo
          cd fndepot_repo

          jq --arg app "$APP_NAME" \
             --arg version "$MANIFEST_VERSION" \
             --arg changelog "$CHANGELOG" \
             --arg url_x86 "$DOWNLOAD_URL_X86" \
             --arg url_arm "$DOWNLOAD_URL_ARM" \
             '.[$app].version = $version |
              .[$app].changelog = $changelog |
              .[$app].arch_diff.x86.download_url = $url_x86 |
              .[$app].arch_diff.arm.download_url = $url_arm' \
             fnpack.json > fnpack.json.tmp
          mv fnpack.json.tmp fnpack.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          git commit -m "chore: update ${APP_NAME} to ${MANIFEST_VERSION} (${TAG})"
          git push
