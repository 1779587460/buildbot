name: Build harness-test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
       
      - name: Install in server directory
        run: |
          mkdir -p server
          npm install @deepseek-ai/dsh

      - name: Compress server directory
        run: tar -czf server.tar.gz server

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-test
          path: server.tar.gz
