name: Build localsend

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 克隆源码
        uses: actions/checkout@v7
        with:
          repository: localsend/web
          path: web-src

      - name: 安装依赖
        working-directory: ./web-src
        run: |
          echo "ignore-scripts=false" > .npmrc
          export PNPM_IGNORE_SCRIPTS=false
          export NPM_CONFIG_IGNORE_SCRIPTS=false
          npm install -g pnpm
          pnpm install --ignore-scripts --frozen-lockfile
          yes | pnpm approve-builds || true
          pnpm install --frozen-lockfile
          pnpm run generate

      - name: 压缩 node_modules
        working-directory: ./web-src
        run: |
          pnpm prune --prod
          tar -czf node_modules.tar.gz node_modules
          rm -rf node_modules

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: localsend-${{ matrix.platform }}
          path: ./web-src
