name: Build localsend

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
          - os: ubuntu-24.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 克隆 unicut 源码
        uses: actions/checkout@v7
        with:
          repository: localsend/web
          path: web-src

      - name: 安装依赖
        working-directory: ./web-src
        run: |
          npm install -g pnpm
          pnpm install
          pnpm approve-builds --interactive=false
          pnpm run generate

      - name: 压缩 node_modules
        working-directory: ./web-src
        run: |
          rm -rf node_modules
          pnpm install --prod --frozen-lockfile
          tar -czf node_modules.tar.gz node_modules
          rm -rf node_modules

      - name: 上传构建产物（整个源码目录）
        uses: actions/upload-artifact@v7
        with:
          name: localsend-${{ matrix.platform }}
          path: ./web-src
