name: Build localsend

on:
  workflow_dispatch:
    inputs:
      signaling_url:
        description: '信令服务器 WebSocket 地址 (例如 wss://your-domain.com/v1/ws) 路径必需为/v1/ws'
        required: true
        default: 'wss://public.localsend.org/v1/ws'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 克隆源码
        uses: actions/checkout@v7
        with:
          repository: localsend/web
          path: web-src

      - name: 构建
        working-directory: ./web-src
        run: |
          npm install -g pnpm
          pnpm install --ignore-scripts --frozen-lockfile
          yes | pnpm approve-builds || true
          pnpm install --frozen-lockfile
          # 设置信令服务器地址环境变量并执行构建
          SIGNALING_URL="${{ github.event.inputs.signaling_url }}" pnpm run generate

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./web-src/dist
