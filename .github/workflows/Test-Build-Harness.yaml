name: Test Build Harness (Vanilla Mirror)

# 这是一份用于核验 Build-Harness.yaml 行为的测试镜像 workflow：
#   - 与生产 Build-Harness.yaml **完全一致**的源码检出 / dshmarket 预置 / 构建 / landlock / fnpack 流水线；
#   - 唯一的差别：**不做任何裁剪**（你想验证的是发布物本身，不是瘦身后的产物）；
#   - 增加"体积报告"步骤：tar.gz 前打印 server 总体积与各分项，便于与 server2 (npx 装) 对比；
#   - `publish` 开关继承自生产 yaml，可在 workflow_dispatch UI 取消勾选（默认 true），
#     与生产 yaml 行为一致 —— 取消则只跑构建并生成 fpk Artifact，不向 Fndepot 推送。

on:
  workflow_dispatch:
    inputs:
      manifest_version:
        description: 'manifest 中的版本号（例如 0.1.0）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文）'
        required: true
        type: string
      publish:
        description: '是否发布到 Fndepot Release（测试时取消勾选即可只构建不发布）'
        required: false
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: x86
          - os: ubuntu-22.04-arm
            platform: arm
    runs-on: ${{ matrix.os }}
    outputs:
      app_name: ${{ steps.set_vars.outputs.app_name }}
      manifest_version: ${{ steps.set_vars.outputs.manifest_version }}
      changelog: ${{ steps.set_vars.outputs.changelog }}
    steps:
      - name: 设置项目变量
        id: set_vars
        run: |
          APP_NAME="Harness"
          MANIFEST_VERSION="${{ github.event.inputs.manifest_version }}"
          CHANGELOG="${{ github.event.inputs.changelog }}"
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "manifest_version=$MANIFEST_VERSION" >> $GITHUB_OUTPUT
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: 检出 deepseek-harness 源码
        uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          fetch-depth: 1
          path: server

      - name: 预置插件市场（把 dshmarket 合并进源码一起构建）
        working-directory: server
        run: |
          set -euo pipefail
          # 为什么不用 `pnpm dsh plugin --profile web add dshmarket`：
          # 它把 profile 写进 CI 机器自己的 $DSH_HOME（~/.dsh/profiles/web），
          # 打包时根本不在 server/ 里，端到端启动后自然不会生效。
          # 改为源码级预置：dshmarket 成为安装依赖 + web profile 模板自带它，
          # 首次启动即自动初始化出带市场的 web profile。
          # 1) apps/cli 是运行时安装锚点（INSTALL_ANCHOR），依赖闭包随 pnpm install 进入 node_modules
          node - <<'NODE'
          const fs = require('fs')
          const p = 'apps/cli/package.json'
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
          if (pkg.dependencies.dshmarket === undefined) {
            pkg.dependencies.dshmarket = '^1.11.1'
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
            console.log('apps/cli/package.json += dshmarket ^1.11.1')
          } else {
            console.log('apps/cli/package.json already has dshmarket, skip')
          }
          NODE
          # 2) web profile 模板带上 dshmarket；INSTALLATION_OWNED 记录旧模板，
          #    让已存在（升级用户）的 web profile 在下次启动时自动迁移补上市场
          node - <<'NODE'
          const fs = require('fs')
          const p = 'packages/boot/app-boot/src/profile.ts'
          let src = fs.readFileSync(p, 'utf8')
          const OLD_T = "  web: ['@deepseek-ai/dsh-base', '@deepseek-ai/dsh-web-app'],"
          const NEW_T = "  web: ['@deepseek-ai/dsh-base', '@deepseek-ai/dsh-web-app', 'dshmarket'],"
          if (!src.includes(NEW_T)) {
            if (!src.includes(OLD_T)) throw new Error('web 模板字符串未找到，上游源码已变化，请人工核对 profile.ts')
            src = src.replace(OLD_T, NEW_T)
          }
          const OLD_O = 'const INSTALLATION_OWNED_PROFILE_TUPLES: Record<string, readonly string[]> = {\n  headless:'
          const NEW_O = 'const INSTALLATION_OWNED_PROFILE_TUPLES: Record<string, readonly string[]> = {\n  web: [\'@deepseek-ai/dsh-base\', \'@deepseek-ai/dsh-web-app\'],\n  headless:'
          if (!src.includes("web: ['@deepseek-ai/dsh-base', '@deepseek-ai/dsh-web-app'],\n  headless:")) {
            if (!src.includes(OLD_O)) throw new Error('INSTALLATION_OWNED 表头未找到，上游源码已变化，请人工核对 profile.ts')
            src = src.replace(OLD_O, NEW_O)
          }
          fs.writeFileSync(p, src)
          console.log('profile.ts: web 模板 + installation-owned 已加入 dshmarket')
          NODE
          grep -n "dshmarket" apps/cli/package.json packages/boot/app-boot/src/profile.ts

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: 安装依赖并构建
        working-directory: server
        run: |
          # CI 下 pnpm 默认 --frozen-lockfile；我们构建期才合并 dshmarket 依赖，
          # 上游锁文件没有它，必须 --no-frozen-lockfile 让其解析并更新锁文件
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential

      - name: 构建 landlock-run
        working-directory: server/native/landlock-run
        run: |
          pnpm run build:native

      - name: 验证插件市场已随安装打包
        working-directory: server
        run: |
          set -euo pipefail
          node -e "const { createRequire } = require('module'); const r = createRequire(process.cwd() + '/apps/cli/package.json'); const p = r.resolve('dshmarket/package.json'); console.log('OK dshmarket 从安装锚点可解析:', p)"
          node -e "const fs=require('fs'); const s=fs.readFileSync('packages/boot/app-boot/src/profile.ts','utf8'); if(!s.includes(\"dshmarket\")) { console.error('web 模板未包含 dshmarket'); process.exit(1) } console.log('OK web profile 模板已预置 dshmarket')"

      - name: 清理源码
        working-directory: server
        run: rm -rf .github .git *.md

      # ──────────────────────────────────────────────────────────────────
      # 裁剪发布物中生产环境用不到的构建残留（本机实测：1.6 GB → 346 MB → tar.gz ≈ 56 MB）
      #
      # 六个波次：
      #   1) 顶层开发期配置文件（lint/test/vitest/knip 等共 19 个）
      #   2) 顶层非运行时目录（docs/examples/website/assets/scripts/python/.agents/.claude）
      #   3) 每个 workspace member 内只留 lib/dist/package.json/*.d.ts，删 src/tests/*.ts/tsconfig/tsdown
      #   4) 删 32 个不被运行时闭包引用的 dev-only workspace member（关联连带清空 vite/esbuild/rolldown/lightningcss）
      #   5) 清根 package.json 的 scripts/devDependencies、各 member 的 devDependencies
      #   6) rm -rf node_modules + pnpm install --prod（带 4 个 config flag 绕开实测发现的坑）
      #
      # ⚠ 不能删 / 必须保留：
      #   vendor/cosmokit、vendor/schemastery（overrides 'link:vendor/...' 指向；运行时 require 真走它们）
      #   native/landlock-run（生产期 Landlock native binding 来源）
      #   apps/web/dist（运行时前端唯一资源）
      #   各 package 的 lib/ 与 *.d.ts（等同发布 npm 包里的 files 出货）
      # ──────────────────────────────────────────────────────────────────
      - name: 裁剪发布物中生产环境用不到的构建残留
        working-directory: server
        run: |
          set -euo pipefail

          # ─ 波次 1：顶层开发期配置文件 ─
          rm -f \
            .gitlab-ci.yml .jscpd.json .oxlintrc.json .oxlintrc.staged.json \
            .rgignore .editorconfig lefthook.yml pytest.ini \
            knip.json CONTRIBUTING.i18n.yaml README.i18n.yaml \
            tsconfig.client.tsbuildinfo tsconfig.host.tsbuildinfo \
            vitest.config.ts vitest.e2e.config.ts vitest.snapshot.config.ts \
            vitest.web.config.ts vitest.web.perf.config.ts vitest.web-stress.config.ts \
            vitest.shared.ts

          # ─ 波次 2：顶层非运行时目录（保留 vendor/ 与 native/） ─
          rm -rf docs examples website assets scripts python .agents .claude

          # ─ 波次 3：每个 workspace member 仅留 lib/dist/package.json/*.d.ts ─
          find packages apps -type d \( -name src -o -name tests -o -name __tests__ \) -prune -exec rm -rf {} +
          find packages apps -type f \( -name "*.ts" ! -name "*.d.ts" \) -delete
          find packages apps -maxdepth 4 -name "tsconfig.json" -delete
          find packages apps -name "tsconfig.tsbuildinfo" -delete
          find packages apps -maxdepth 4 -name "tsdown.config.ts" -delete

          # ─ 波次 4：删 32 个不被运行时闭包引用的 dev-only workspace member ─
          UNUSED_MEMBERS=(
            vendor/logger-console
            packages/acp/acp
            packages/examples/acp-demo
            packages/examples/agent-spine-demo
            packages/examples/jsonrpc-demo
            packages/test-support/acp-snapshot
            packages/test-support/agent-loop-testkit
            packages/test-support/client-runtime
            packages/test-support/llm-mock-server
            packages/test-support/llm-replay
            packages/test-support/loader-smoke
            packages/e2b/e2b
            packages/e2b/fs-e2b
            packages/e2b/subprocess-e2b
            packages/hooks/hook-protocol
            packages/hooks/hooks-claude-code
            packages/hooks/hooks-codex
            packages/lsp/lsp
            packages/lsp/lsp-stdio
            packages/lsp/tool-lsp
            packages/sdk/client
            packages/sdk/protocol
            packages/sdk/server
            packages/session/session-persistence-sqlite
            packages/session/session-title-all-prompts-llm
            packages/storage/storage-sqlite
            packages/subagent/subagent-acp
            packages/terminal/tool-terminal
            packages/session-query/tool-session-query
            packages/web/web-fetch-http
            packages/web/web-search-exa
            packages/web/web-search-perplexity
          )
          for d in "${UNUSED_MEMBERS[@]}"; do
            [ -d "$d" ] && rm -rf "$d" || echo "skip (already gone): $d"
          done

          # ─ 波次 5：清根/各 member 的 scripts 与 devDependencies ─
          node - <<'NODE'
          const fs = require('fs'), path = require('path')
          {
            const p = './package.json'
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
            pkg.scripts = {}
            delete pkg.devDependencies
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n')
            console.log('根 package.json: 清空 scripts + 删除 devDependencies')
          }
          function stripMember(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!e.isDirectory() || e.name === 'node_modules' || e.name === '.git') continue
              const sub = path.join(dir, e.name)
              const pj = path.join(sub, 'package.json')
              if (fs.existsSync(pj)) {
                const pkg = JSON.parse(fs.readFileSync(pj, 'utf8'))
                let touched = false
                if (pkg.scripts && Object.keys(pkg.scripts).length) { pkg.scripts = {}; touched = true }
                if (pkg.devDependencies) { delete pkg.devDependencies; touched = true }
                if (touched) fs.writeFileSync(pj, JSON.stringify(pkg, null, 2) + '\n')
              }
              stripMember(sub)
            }
          }
          for (const root of ['packages', 'apps', 'vendor']) {
            if (fs.existsSync(root)) stripMember(root)
          }
          NODE

          # ─ 波次 6：从干净状态重装 prod-only 闭包 ─
          # 不能用 pnpm prune --prod：本机实测发现带 lefthook postinstall 时它会在
          # 无 TTY 环境抛 ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY 并整体清空 store（1.5G→100K）。
          # 改为删 node_modules + 重新 install --prod 最干净。
          rm -rf node_modules
          CI=true pnpm install --prod \
            --no-frozen-lockfile \
            --config.confirmModulesPurge=false \
            --config.dangerouslyAllowAllBuilds=true \
            --config.minimumReleaseAge=0 \
            --config.strictDepBuilds=false

      - name: 压缩 server 目录
        run: |
          tar -czf server.tar.gz server
          ls -lh server.tar.gz

      - name: 检出 buildbot 仓库（包含 fnpack 模板）
        uses: actions/checkout@v7
        with:
          path: buildbot_repo

      - name: 准备 fnpack 工作区
        run: |
          mkdir -p build_workspace
          cp -r "buildbot_repo/fnpack/${{ steps.set_vars.outputs.app_name }}" build_workspace/
          if [ "${{ matrix.platform }}" = "x86" ]; then
            FNPACK_BIN="fnpack-1.2.1-linux-amd64"
          else
            FNPACK_BIN="fnpack-1.2.1-linux-arm64"
          fi
          cp "buildbot_repo/fnpack/$FNPACK_BIN" build_workspace/fnpack
          chmod +x build_workspace/fnpack

      - name: 复制压缩包到 app 目录
        run: |
          mkdir -p build_workspace/Harness/app
          cp server.tar.gz build_workspace/Harness/app/

      - name: 修改 manifest 文件
        run: |
          MANIFEST_PATH="build_workspace/${{ steps.set_vars.outputs.app_name }}/manifest"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "错误：manifest 文件不存在于 $MANIFEST_PATH"
            exit 1
          fi
          MANIFEST_VERSION="${{ steps.set_vars.outputs.manifest_version }}"
          CHANGELOG="${{ steps.set_vars.outputs.changelog }}"
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | jq -sRr @json)
          sed -i "s/\${VERSION}/$MANIFEST_VERSION/g" "$MANIFEST_PATH"
          sed -i "s/\${CHANGELOG}/$ESCAPED_CHANGELOG/g" "$MANIFEST_PATH"
          sed -i "s/\${PLATFORM}/${{ matrix.platform }}/g" "$MANIFEST_PATH"
          echo "manifest 修改后的内容："
          cat "$MANIFEST_PATH"

      - name: 执行 fnpack 打包
        run: |
          cd build_workspace
          ./fnpack build "${{ steps.set_vars.outputs.app_name }}"
          FPK_FILE=$(ls *.fpk | head -n 1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到生成的 fpk 文件"
            exit 1
          fi
          FINAL_NAME="${{ steps.set_vars.outputs.app_name }}-${{ steps.set_vars.outputs.manifest_version }}-${{ matrix.platform }}.fpk"
          mv "$FPK_FILE" "$FINAL_NAME"
          echo "FINAL_FPK=$FINAL_NAME" >> $GITHUB_ENV
          echo "打包完成，生成文件：$FINAL_NAME"
          ls -la *.fpk

      # 测试运行时上传 fpk 到 Artifact，与 publish 解耦：取消 publish 也仍能在 Action UI 下载 fpk
      - name: 上传 fpk 文件作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpk-${{ matrix.platform }}
          path: build_workspace/*.fpk
          if-no-files-found: error

  publish:
    name: 发布到 Fndepot Release
    needs: build
    # publish 开关继承自生产 yaml；测试时在 UI 上取消勾选即仅构建 + 输出 fpk Artifact，不发布
    if: always() && needs.build.result == 'success' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载所有架构的 fpk 文件
        uses: actions/download-artifact@v7
        with:
          path: fpk_files
          merge-multiple: true

      - name: 生成当前日期 tag（格式 年.月.日）
        id: date_tag
        run: |
          TAG=$(date +'%Y.%-m.%-d')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=【$TAG 更新】" >> $GITHUB_OUTPUT

      - name: 使用 GitHub CLI 发布到 shuangji66/Fndepot
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="shuangji66/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          TITLE="${{ steps.date_tag.outputs.RELEASE_TITLE }}"
          MANIFEST_VERSION="${{ needs.build.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build.outputs.changelog }}"
          NEW_NOTE="构建 ${{ needs.build.outputs.app_name }} 版本 ${MANIFEST_VERSION}。更新日志：${CHANGELOG}"

          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            echo "Release $TAG 已存在，将添加资产并追加描述"
            CURRENT_BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
            if [ -n "$CURRENT_BODY" ]; then
              NEW_BODY="${CURRENT_BODY}"$'\n'"$NEW_NOTE"
            else
              NEW_BODY="$NEW_NOTE"
            fi
            gh release edit "$TAG" --repo "$REPO" --notes "$NEW_BODY"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NEW_NOTE"
          fi

          for fpk in fpk_files/*.fpk; do
            echo "上传 $fpk"
            gh release upload "$TAG" "$fpk" --repo "$REPO" --clobber
          done

      - name: 更新 fnpack.json 中的 Harness 条目
        env:
          GH_TOKEN: ${{ secrets.BUILDBOT }}
        run: |
          REPO="shuangji66/Fndepot"
          TAG="${{ steps.date_tag.outputs.tag }}"
          APP_NAME="${{ needs.build.outputs.app_name }}"
          MANIFEST_VERSION="${{ needs.build.outputs.manifest_version }}"
          CHANGELOG="${{ needs.build.outputs.changelog }}"

          DOWNLOAD_URL_X86="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-x86.fpk"
          DOWNLOAD_URL_ARM="https://github.com/${REPO}/releases/download/${TAG}/${APP_NAME}-${MANIFEST_VERSION}-arm.fpk"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" fndepot_repo
          cd fndepot_repo

          jq --arg app "$APP_NAME" \
             --arg version "$MANIFEST_VERSION" \
             --arg changelog "$CHANGELOG" \
             --arg url_x86 "$DOWNLOAD_URL_X86" \
             --arg url_arm "$DOWNLOAD_URL_ARM" \
             '.[$app].version = $version |
              .[$app].changelog = $changelog |
              .[$app].arch_diff.x86.download_url = $url_x86 |
              .[$app].arch_diff.arm.download_url = $url_arm' \
             fnpack.json > fnpack.json.tmp
          mv fnpack.json.tmp fnpack.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          git commit -m "chore: update ${APP_NAME} to ${MANIFEST_VERSION} (${TAG})"
          git push
